<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>checkout // liminal abyss caress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:#0b0b0b;
color:#e8e8e8;
font-family:"IBM Plex Mono", monospace;
display:flex;
justify-content:center;
align-items:center;
}

.checkout{
width:min(1000px,90vw);
display:grid;
grid-template-columns:45% 55%;
border:1px solid rgba(255,255,255,.15);
background:#101010;
}

.imagePanel{
padding:30px;
border-right:1px solid rgba(255,255,255,.15);
}

.imageWrap{
width:100%;
aspect-ratio:1 / 1.2;
overflow:hidden;
background:#050505;
}

.imageWrap img{
width:100%;
height:100%;
object-fit:cover;
}

.infoPanel{
padding:45px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.header{
font-size:11px;
letter-spacing:4px;
text-transform:uppercase;
opacity:.5;
margin-bottom:60px;
}

h1{
font-size:28px;
font-weight:400;
letter-spacing:2px;
margin:0 0 45px;
text-transform:lowercase;
}

.data{
font-size:13px;
line-height:2.2;
color:#b8b8b8;
}

.data span{
color:#ffffff;
}

.price{
font-size:32px;
margin-top:50px;
letter-spacing:3px;
}

.action{
margin-top:40px;
border:1px solid rgba(255,255,255,.3);
padding:18px;
text-align:center;
font-size:12px;
letter-spacing:4px;
text-transform:uppercase;
cursor:pointer;
}

.action:hover{
background:white;
color:black;
}

.footer{
margin-top:30px;
font-size:10px;
letter-spacing:3px;
opacity:.4;
}


@media(max-width:700px){

.checkout{
display:block;
}

.imagePanel{
border-right:none;
border-bottom:1px solid rgba(255,255,255,.15);
}

.infoPanel{
padding:30px;
}

}

</style>

</head>

<body>


<div class="checkout">


<div class="imagePanel">

<div class="imageWrap">

<img src="https://raw.githubusercontent.com/axaxayacatl/liminalabysscaress/main/thumbnails/brathumbnail.png">

</div>

</div>



<div class="infoPanel">


<div>

<div class="header">
checkout companion
</div>


<h1>
01 / lattice bra v1
</h1>


<div class="data">

object: <span>lattice bra v1</span><br>

type: <span>structure</span><br>

format: <span>assistant</span><br>

access: <span>restricted</span><br>

delivery: <span>digital artifact</span>

</div>


<div class="price">
$120
</div>


<div class="action">
confirm acquisition
</div>

</div>



<div class="footer">
liminal abyss caress<br>
selected object interface
</div>


</div>


</div>


</body>
</html>
