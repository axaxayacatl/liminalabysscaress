<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAC Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #1a1330, #0b0914);
  color: #e6dcff;
  font-family: 'Space Grotesk', sans-serif;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 20px;
}

.banner { text-align: center; margin-bottom: 20px; }
.banner h1 { font-size: 40px; letter-spacing: 12px; font-weight: 300; margin: 0; }

.definition {
  font-size: 10px;
  opacity: 0.45;
  line-height: 1.8;
  text-align: center;
}
.definition a {
  color: #cfc1ff;
  text-decoration: none;
  opacity: 0.5;
  margin: 0 4px;
  transition: 0.3s;
}
.definition a:hover { opacity: 1; }

.archiveContainer {
  border-radius: 22px;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(180,150,255,0.18);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.archiveFragment {
  font-family: 'Space Grotesk', monospace;
  font-size: 12px;
  line-height: 1.6;
  opacity: 0.85;
  transition: opacity 0.5s;
}

.nextFragmentBtn {
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  opacity: 0.6;
  transition: 0.3s;
  align-self: flex-end;
}
.nextFragmentBtn:hover { opacity: 1; }

.footer {
  font-size: 10px;
  opacity: 0.4;
  display: flex;
  justify-content: space-between;
  margin-top: auto;
}
</style>
</head>
<body>
<div class="container">
  <div class="banner"><h1>LAC</h1></div>

  <div class="definition">
    <span>archive → digital transcripts / fragmented rituals / sensory artifacts</span>
    <span>
      <a href="index.html">home</a> x
      <a href="newsletter.html">newsletter</a>
    </span>
  </div>

  <div class="archiveContainer">
    <div id="archiveStage" class="archiveFragment">loading transcripts...</div>
    <div class="nextFragmentBtn" onclick="nextFragment()">next fragment →</div>
  </div>

  <div class="footer">
    <span>home</span>
    <span>archive</span>
    <span>info</span>
  </div>
</div>

<script>
const fragments = [
`INITIATE caress_sequence_v2
input: skin_temperature ~34.7°C
WAIT 0.3s
pulse: synthetic rhythm
ABORT if signal != accepted`,

`LOAD interaction_loop_03
sensor: tactile membrane
adjust: softness +0.2
RECORD: ephemeral feedback
TERMINATE sequence`,

`BEGIN liminal_encounter
touch: digital lattice
delay: 0.5s
repeat until: threshold_exceeded
LOG: ritual residue`,

`SENSORY_FEED:
top_note: lilac-stasis
heart_resonance: synthetic dermis
base_signature: warm polymer / soft void
OUTPUT: ephemeral trace`,

`SCENT_MATRIX: fragment
volatile: 0.72
residual: 0.31
perceived: intangible
ARCHIVE: sensory echo`,

`AUDIO_WAVE:
frequency: 432Hz
amplitude: subtle
texture: granular
recorded: memory trace`
];

const container = document.getElementById('archiveContainer');
fragments.forEach(fragment => {
  const div = document.createElement('div');
  div.className = 'archiveFragment';
  div.textContent = fragment;
  container.appendChild(div);
});
</script>
</body>
</html>
