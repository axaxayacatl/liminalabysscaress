<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liminal Abyss Caress</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600&display=swap');

:root {
  --bg: #e9e7ed;
  --ink: #514d5d;
  --muted: #9691a2;
  --violet: #9c8eaf;
  --line: rgba(112,101,132,.15);
  --glow: rgba(174,157,204,.34);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: Manrope, Arial, sans-serif;
  overflow-x: hidden;
  background: radial-gradient(
    ellipse at 50% 38%,
    #f7f5f9 0,
    #eeecf2 43%,
    #e3e0e9 100%
  );
}

/* Subtle CRT overlay across the entire page */

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  opacity: .12;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(68,59,82,.12) 4px
  );
  animation: flicker 7s infinite steps(1);
}

body:after {
  content: "";
  position: fixed;
  inset: -20%;
  pointer-events: none;
  z-index: 19;
  opacity: .12;
  background: linear-gradient(
    110deg,
    transparent 35%,
    rgba(255,255,255,.55) 48%,
    transparent 60%
  );
  transform: translateX(-65%);
  animation: scan 12s linear infinite;
}

@keyframes flicker {
  0%, 96%, 100% { opacity: .12; }
  97% { opacity: .18; }
  98% { opacity: .08; }
  99% { opacity: .15; }
}

@keyframes scan {
  to { transform: translateX(65%); }
}

/* Main layout */

.shell {
  width: min(1180px, 92vw);
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 26px 0 24px;
  position: relative;
}

/* Centered custom logo */

header {
  height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.logo {
  height: 160px;
  object-fit: contain;
  filter: drop-shadow(0 0 20px var(--glow));
}

.corner {
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  font: 10px 'DM Mono', monospace;
  letter-spacing: .18em;
  color: #91899e;
  text-align: right;
}

/* Product showcase and animated visual */

main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(280px, .82fr);
  align-items: center;
  gap: clamp(24px, 5vw, 76px);
  padding: 16px 3.5% 35px;
}

.shop {
  min-width: 0;
  position: relative;
}

.eyebrow {
  font: 10px 'DM Mono', monospace;
  letter-spacing: .22em;
  color: #9a91a8;
  margin: 0 0 22px 4px;
}

/* Carousel stage */

.stage {
  height: clamp(360px, 53vw, 540px);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1100px;
  overflow: hidden;
}

.product {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transform: translateX(45px) rotateY(-12deg) scale(.96);
  transition:
    opacity .48s ease,
    transform .7s cubic-bezier(.2,.7,.2,1);
  pointer-events: none;
}

.product.active {
  opacity: 1;
  transform: translateX(0) rotateY(0) scale(1);
  pointer-events: auto;
}

.product.leaving {
  opacity: 0;
  transform: translateX(-48px) rotateY(12deg) scale(.96);
}

/* Circular sigil placeholder */

.object {
  width: min(70%, 340px);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 18px 28px rgba(111,96,137,.16));
}

.object:before {
  content: "";
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(189,176,211,.38),
    rgba(214,207,224,.12) 58%,
    transparent 74%
  );
  filter: blur(16px);
}

.sigil {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(
    circle at 48% 42%,
    rgba(255,255,255,.86),
    rgba(222,217,231,.62) 58%,
    rgba(193,184,209,.38)
  );
  box-shadow:
    inset 0 0 26px rgba(255,255,255,.86),
    0 0 32px rgba(163,148,190,.22);
  overflow: hidden;
}

.sigil:before,
.sigil:after {
  content: "";
  position: absolute;
  border: 1px solid rgba(117,103,145,.45);
  border-radius: 50%;
  inset: 8%;
}

.sigil:after {
  inset: 17%;
  border-color: rgba(155,139,180,.55);
}

.sigil-art {
  position: relative;
  width: 72%;
  height: 72%;
  overflow: visible;
  fill: none;
  stroke: #827692;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 5px rgba(151,129,180,.38));
}

.sigil-02 .sigil-art {
  transform: rotate(30deg);
}

.sigil-03 .sigil-art {
  transform: rotate(-18deg);
}

/* Product title and ETH price */

.product-meta {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: end;
  padding: 0 7%;
  margin-top: 4px;
}

.name {
  font-size: 13px;
  letter-spacing: .13em;
  text-transform: uppercase;
  font-weight: 500;
}

.price {
  font: 12px 'DM Mono', monospace;
  color: #81778f;
}

.index {
  font: 10px 'DM Mono', monospace;
  color: #a49cad;
  letter-spacing: .15em;
  margin-top: 12px;
}

/* Carousel arrows and progress */

.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 20px 7% 0;
}

.arrow {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  color: #71677f;
  box-shadow: 0 0 20px rgba(160,145,186,.13);
  font-size: 21px;
  cursor: pointer;
  transition: transform .2s, background .2s;
}

.arrow:hover {
  background: rgba(255,255,255,.9);
}

#prev:hover {
  transform: translateX(-3px);
}

#next:hover {
  transform: translateX(3px);
}

.progress {
  height: 1px;
  background: rgba(123,111,144,.2);
  flex: 1;
  position: relative;
}

.progress span {
  display: block;
  height: 1px;
  background: #9283a8;
  width: 33.333%;
  transition: width .4s;
}

/* Animated visual on the right */

.visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 420px;
}

.visual-frame {
  width: min(100%, 390px);
  position: relative;
  filter: drop-shadow(0 0 30px rgba(157,140,185,.22));
}

.visual-frame:before {
  content: "";
  position: absolute;
  inset: 8% -8%;
  background: radial-gradient(
    ellipse,
    rgba(194,181,216,.35),
    transparent 70%
  );
  filter: blur(25px);
}

.visual img {
  display: block;
  position: relative;
  width: 100%;
  height: auto;
  object-fit: contain;
  mix-blend-mode: multiply;
  mask-image: radial-gradient(
    ellipse at center,
    #000 48%,
    rgba(0,0,0,.92) 68%,
    transparent 100%
  );
}

.visual-label {
  position: absolute;
  bottom: -22px;
  right: 2px;
  font: 9px 'DM Mono', monospace;
  letter-spacing: .2em;
  color: #9c93a8;
}

/* Responsive adjustments */

@media (max-width: 760px) {
  .shell {
    padding-top: 12px;
  }

  header {
    height: 90px;
  }

  .corner {
    font-size: 8px;
    top: auto;
    bottom: 4px;
    right: 0;
    transform: none;
  }

  main {
    grid-template-columns: 1fr;
    gap: 0;
    padding: 10px 0 26px;
  }

  .shop {
    order: 1;
  }

  .visual {
    order: 2;
    min-height: 220px;
    margin-top: 12px;
  }

  .visual-frame {
    width: min(54vw, 230px);
  }

  .stage {
    height: 390px;
  }

  .object {
    width: min(64%, 300px);
  }

  .product-meta {
    padding: 0 4%;
  }

  .controls {
    margin-left: 4%;
    margin-right: 4%;
  }

  footer {
    font-size: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div class="shell">

  <header>
    <img
      class="logo"
      src="https://raw.githubusercontent.com/axaxayacatl/liminalabysscaress/refs/heads/main/lac_logo.png"
      alt="Custom logo"
    >
    <div class="corner">ETH / OBJECTS<br>ONLINE</div>
  </header>

  <main>

    <!-- Product showcase -->
    <section class="shop" aria-label="Product showcase">

      <p class="eyebrow">COLLECTION / 001</p>

      <div class="stage" id="stage">

        <!-- Product 01 -->
        <article class="product active">

          <div class="object">
            <div
              class="sigil sigil-01"
              role="img"
              aria-label="Circular geometric sigil placeholder"
            >
              <svg
                class="sigil-art"
                viewBox="0 0 100 100"
                aria-hidden="true"
              >
                <circle cx="50" cy="50" r="34"/>
                <circle cx="50" cy="50" r="23"/>
                <path d="M50 8 58 38 88 50 58 62 50 92 42 62 12 50 42 38Z"/>
                <path d="M50 22 50 78M22 50 78 50M30 30 70 70M70 30 30 70"/>
                <circle cx="50" cy="50" r="5"/>
              </svg>
            </div>
          </div>

          <div class="product-meta">
            <span class="name">Lattice Bra</span>
            <span class="price">0.0713 ETH</span>
          </div>

          <div class="index">01 / 03</div>

        </article>

        <!-- Product 02 -->
        <article class="product">

          <div class="object">
            <div
              class="sigil sigil-02"
              role="img"
              aria-label="Circular geometric sigil placeholder"
            >
              <svg
                class="sigil-art"
                viewBox="0 0 100 100"
                aria-hidden="true"
              >
                <circle cx="50" cy="50" r="35"/>
                <path d="M50 12 82 31 82 69 50 88 18 69 18 31Z"/>
                <path d="M50 12 50 88M18 31 82 69M82 31 18 69M18 50 82 50"/>
                <path d="M50 27 70 50 50 73 30 50Z"/>
                <circle cx="50" cy="50" r="7"/>
              </svg>
            </div>
          </div>

          <div class="product-meta">
            <span class="name">Corset Generator</span>
            <span class="price">0.1427 ETH</span>
          </div>

          <div class="index">02 / 03</div>

        </article>

        <!-- Product 03 -->
        <article class="product">

          <div class="object">
            <div
              class="sigil sigil-03"
              role="img"
              aria-label="Circular geometric sigil placeholder"
            >
              <svg
                class="sigil-art"
                viewBox="0 0 100 100"
                aria-hidden="true"
              >
                <circle cx="50" cy="50" r="35"/>
                <circle cx="50" cy="50" r="27"/>
                <path d="M50 14 58 39 84 50 58 61 50 86 42 61 16 50 42 39Z"/>
                <path d="M50 24 74 50 50 76 26 50Z"/>
                <path d="M50 7V93M7 50H93"/>
                <circle cx="50" cy="50" r="4"/>
              </svg>
            </div>
          </div>

          <div class="product-meta">
            <span class="name">Wet Mesh</span>
            <span class="price">0.0476 ETH</span>
          </div>

          <div class="index">03 / 03</div>

        </article>

      </div>

      <!-- Previous / next controls -->
      <div class="controls">

        <button
          class="arrow"
          id="prev"
          type="button"
          aria-label="Previous product"
        >←</button>

        <div class="progress">
          <span id="progress"></span>
        </div>

        <button
          class="arrow"
          id="next"
          type="button"
          aria-label="Next product"
        >→</button>

      </div>

    </section>

    <!-- Animation on the right -->
    <aside class="visual">

      <div class="visual-frame">

        <img
          src="https://raw.githubusercontent.com/axaxayacatl/liminalabysscaress/refs/heads/main/axayacatl.gif"
          alt="Animated Axayacatl visual"
        >

        <span class="visual-label">LIVE SIGNAL / 001</span>

      </div>

    </aside>

  </main>

</div>

<script>
(() => {
  const items = [...document.querySelectorAll('.product')];
  const progress = document.getElementById('progress');

  let current = 0;
  let locked = false;

  function show(next) {
    if (locked || next === current) return;

    locked = true;

    const old = items[current];
    const target = (next + items.length) % items.length;

    old.classList.remove('active');
    old.classList.add('leaving');

    items[target].classList.remove('leaving');
    items[target].classList.add('active');

    current = target;

    progress.style.width =
      ((current + 1) / items.length * 100) + '%';

    setTimeout(() => {
      old.classList.remove('leaving');
      locked = false;
    }, 720);
  }

  // Right arrow = next product
  document
    .getElementById('next')
    .addEventListener('click', () => {
      show(current + 1);
    });

  // Left arrow = previous product
  document
    .getElementById('prev')
    .addEventListener('click', () => {
      show(current - 1);
    });

  // Keyboard navigation
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowRight') {
      show(current + 1);
    }

    if (event.key === 'ArrowLeft') {
      show(current - 1);
    }
  });

  // Touch swipe navigation
  let startX = 0;
  const stage = document.getElementById('stage');

  stage.addEventListener(
    'touchstart',
    event => {
      startX = event.changedTouches[0].clientX;
    },
    { passive: true }
  );

  stage.addEventListener(
    'touchend',
    event => {
      const dx = event.changedTouches[0].clientX - startX;

      if (Math.abs(dx) > 45) {
        show(current + (dx < 0 ? 1 : -1));
      }
    },
    { passive: true }
  );

})();
</script>

</body>
</html>
